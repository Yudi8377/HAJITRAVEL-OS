name: Self-Hosted Deploy

on:
  workflow_dispatch:

concurrency:
  group: hajitravel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -e
          test -n "$DEPLOY_HOST"
          test -n "$SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and health-check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          PATH_ON_SERVER: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          : "${USER:?DEPLOY_USER is required}"
          : "${HOST:?DEPLOY_HOST is required}"
          PATH_ON_SERVER="${PATH_ON_SERVER:-/opt/hajitravel-os}"
          PORT="${PORT:-22}"

          ssh -p "$PORT" "$USER@$HOST" "set -e
            mkdir -p '$PATH_ON_SERVER'
            cd '$PATH_ON_SERVER'
            if [ ! -d .git ]; then
              git clone 'https://github.com/Yudi8377/HAJITRAVEL-OS.git' .
            fi
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            test -f .env.production
            docker compose up -d --build
            sleep 8
            curl -fsS http://127.0.0.1:3000/api/health
            docker compose ps
          "
