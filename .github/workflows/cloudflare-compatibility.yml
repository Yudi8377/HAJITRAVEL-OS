name: Cloudflare Workers Compatibility Test

on:
  push:
    branches:
      - "test/cloudflare-workers-compatibility"
  workflow_dispatch:

jobs:
  vinext-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compatibility check
        run: npx vinext check
      - name: Initialize Cloudflare Workers build
        run: npx vinext init --platform=cloudflare --skip-check
      - name: Inspect generated configuration
        run: |
          echo "=== package scripts ==="
          node -e "console.log(require('./package.json').scripts)"
          echo "=== generated files ==="
          find . -maxdepth 2 -type f \( -name 'cloudflare.config.*' -o -name 'wrangler.toml' -o -name 'wrangler.jsonc' \) -print
          echo "=== build script ==="
          node -e "console.log(require('./package.json').scripts['build:vinext'] || 'MISSING')"
      - name: Build Workers artifact
        run: npm run build:vinext
      - name: Validate generated Cloudflare configuration
        run: |
          test -d .cloudflare/output
          echo "Cloudflare build output present"
