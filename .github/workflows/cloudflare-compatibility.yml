name: Cloudflare Workers Compatibility Test

on:
  push:
    branches:
      - "test/cloudflare-workers-compatibility"
  workflow_dispatch:

jobs:
  vinext-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compatibility check
        run: npx vinext check
      - name: Initialize Cloudflare Workers build
        run: npx vinext init --platform=cloudflare --skip-check
      - name: Build Workers artifact
        run: npm run build:vinext
      - name: Local Worker smoke test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: smoke-test-key
        run: |
          nohup npm run start:vinext -- --host 127.0.0.1 --port 8787 > /tmp/vinext-worker.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/api/health >/tmp/health.json 2>/tmp/curl.err; then
              echo "Worker health endpoint responded"
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          echo "Worker preview failed to answer /api/health"
          cat /tmp/vinext-worker.log
          cat /tmp/curl.err
          exit 1
