name: Cloudflare Workers Compatibility Test

on:
  push:
    branches:
      - "test/cloudflare-workers-compatibility"
  workflow_dispatch:

jobs:
  vinext-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compatibility check
        run: npx vinext check
      - name: Initialize Cloudflare Workers build
        run: npx vinext init --platform=cloudflare --skip-check
      - name: Build Workers artifact
        run: npm run build:vinext
      - name: Validate generated Cloudflare configuration
        run: |
          test -f cloudflare.config.ts
          test -d .cloudflare/output
          echo "Cloudflare build output present"
