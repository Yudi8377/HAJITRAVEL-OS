name: HAJITRAVEL OS Cloudflare Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://gwjknstrhaxvlyadvlje.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_GXTzuxEa6FDBTcfC6KFyKw_WER6YDG1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Initialize vinext for Cloudflare Workers
        run: npx vinext init --platform=cloudflare --skip-check

      - name: Typecheck
        run: npm run typecheck

      - name: Build Cloudflare Worker
        run: npm run build:vinext

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment summary
        run: |
          echo "HAJITRAVEL OS Cloudflare deployment completed."
          echo "Worker: hajitravel-os"
          echo "Commit: $GITHUB_SHA"