services:
  hajitravel-os:
    build:
      context: .
      dockerfile: Dockerfile
    image: hajitravel-os:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
